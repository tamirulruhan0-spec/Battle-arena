<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#07140e">
<title>BATTLE ARENA 3D</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  user-select: none;
  -webkit-user-select: none;
}
body {
  overflow: hidden;
  background: #07140e;
  font-family: Arial, sans-serif;
  color: white;
  touch-action: none;
}
canvas {
  display: block;
}
button {
  cursor: pointer;
  font-family: inherit;
}
#game {
  position: fixed;
  inset: 0;
}
#hud {
  position: fixed;
  inset: 0;
  pointer-events: none;
}
.panel {
  background: rgba(5,20,17,.78);
  border: 1px solid rgba(90,255,160,.5);
  border-radius: 12px;
  padding: 10px 13px;
  backdrop-filter: blur(8px);
  box-shadow: 0 5px 20px #0004;
}
#topbar {
  position: absolute;
  top: 14px;
  left: 12px;
  right: 12px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
}
.brand {
  color: #65ffa0;
  font-weight: 900;
  letter-spacing: 1px;
}
#healthBox {
  position: absolute;
  top: 75px;
  left: 12px;
  width: 155px;
}
.small {
  font-size: 11px;
  color: #c8e6d2;
}
.bar {
  height: 10px;
  background: #26362e;
  border-radius: 20px;
  overflow: hidden;
  margin: 6px 0;
}
#healthFill {
  height: 100%;
  width: 100%;
  background: linear-gradient(90deg,#12c76a,#91ff89);
  transition: width .2s;
}
#zoneBox {
  position: absolute;
  top: 75px;
  right: 12px;
  text-align: right;
}
#miniMap {
  position: absolute;
  right: 12px;
  top: 155px;
  width: 115px;
  height: 115px;
  border: 2px solid #73ffad;
  border-radius: 12px;
  background: #102b20;
}
#message {
  position: absolute;
  top: 38%;
  left: 0;
  width: 100%;
  text-align: center;
  font-size: 24px;
  font-weight: 900;
  color: white;
  text-shadow: 0 3px 10px black;
  pointer-events: none;
}
#joystick {
  position: absolute;
  left: 20px;
  bottom: 28px;
  width: 128px;
  height: 128px;
  border-radius: 50%;
  border: 2px solid #ffffff70;
  background: #ffffff20;
  pointer-events: auto;
  touch-action: none;
}
#stick {
  position: absolute;
  width: 52px;
  height: 52px;
  left: 36px;
  top: 36px;
  border-radius: 50%;
  background: #67ffa0;
  box-shadow: 0 0 18px #39ff88;
}
#actions {
  position: absolute;
  right: 17px;
  bottom: 27px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  pointer-events: auto;
}
.action {
  width: 69px;
  height: 69px;
  border-radius: 50%;
  border: 2px solid #aaffc5;
  background: #075d3cdd;
  color: white;
  font-size: 11px;
  font-weight: bold;
  touch-action: none;
}
.action:active {
  background: #19b76b;
  transform: scale(.94);
}
#hint {
  position: absolute;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 10px;
  white-space: nowrap;
  color: #ddd;
}
#overlay {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  background: linear-gradient(#03140c99,#03140ceF);
}
#menu {
  width: min(100%,390px);
  text-align: center;
  padding: 30px 22px;
  border: 1px solid #56ed99;
  border-radius: 20px;
  background: linear-gradient(145deg,#123c2b,#07170f);
  box-shadow: 0 0 45px #18d66a25;
}
#menu h1 {
  font-size: 36px;
  color: #70ffa6;
  letter-spacing: 2px;
  text-shadow: 0 0 20px #24ff7a66;
}
#menu h2 {
  font-size: 14px;
  color: #e2ffed;
  margin-top: 5px;
  letter-spacing: 5px;
}
#menu p {
  margin: 22px 0;
  color: #c6dfcf;
  line-height: 1.7;
  font-size: 13px;
}
.primary {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(90deg,#13a65d,#57f39a);
  color: #04180c;
  font-weight: 900;
  font-size: 17px;
}
.secondary {
  margin-top: 12px;
  width: 100%;
  padding: 12px;
  border: 1px solid #63e99c;
  background: transparent;
  border-radius: 10px;
  color: white;
}
#settings {
  display: none;
  margin-top: 16px;
  color: white;
  font-size: 13px;
  line-height: 2;
}
#settings label {
  display: block;
}
#settings input {
  accent-color: #52e993;
}
.hidden {
  display: none !important;
}
@media(max-height:600px) {
  #joystick {
    width: 105px;
    height: 105px;
  }
  #stick {
    left: 27px;
    top: 27px;
  }
  .action {
    width: 60px;
    height: 60px;
  }
}
</style>
</head>

<body>
<div id="game"></div>

<div id="hud" class="hidden">
  <div id="topbar">
    <div class="panel brand">BATTLE ARENA</div>
    <div class="panel">
      <div class="small">SURVIVORS</div>
      <strong id="players">6</strong> / 6
    </div>
  </div>

  <div id="healthBox" class="panel">
    <strong>HEALTH</strong>
    <div class="bar"><div id="healthFill"></div></div>
    <span id="healthText" class="small">100 / 100</span>
  </div>

  <div id="zoneBox" class="panel">
    <div class="small">SAFE ZONE</div>
    <strong id="zoneText">44 m</strong>
    <div class="small" id="timer">READY</div>
  </div>

  <canvas id="miniMap" width="200" height="200"></canvas>

  <div id="message"></div>

  <div id="joystick">
    <div id="stick"></div>
  </div>

  <div id="actions">
    <button class="action" id="pulse">ENERGY<br>PULSE</button>
    <button class="action" id="jump">JUMP</button>
    <button class="action" id="sprint">SPRINT</button>
  </div>

  <div id="hint">DRAG RIGHT SIDE OF SCREEN TO ROTATE CAMERA</div>
</div>

<div id="overlay">
  <div id="menu">
    <h1>BATTLE ARENA</h1>
    <h2>LAST SURVIVOR</h2>
    <p>
      ENTER THE ISLAND.<br>
      EXPLORE THE ARENA.<br>
      TAG YOUR OPPONENTS.<br>
      BE THE LAST SURVIVOR.
    </p>

    <button class="primary" id="start">START GAME</button>
    <button class="secondary" id="settingBtn">SETTINGS</button>

    <div id="settings">
      <label>
        <input type="checkbox" id="shadows" checked>
        Enable shadows
      </label>
      <label>
        <input type="checkbox" id="sound">
        Enable sound effects
      </label>
    </div>

    <p class="small">BATTLE ARENA 3D • MOBILE EDITION</p>
  </div>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

// ---------------- GAME SETUP ----------------

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8bc9e8);
scene.fog = new THREE.Fog(0x8bc9e8,45,115);

const camera = new THREE.PerspectiveCamera(
  65, innerWidth/innerHeight,.1,200
);

const renderer = new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

document.getElementById("game").appendChild(renderer.domElement);

// ---------------- LIGHTS ----------------

scene.add(new THREE.HemisphereLight(0xe4f6ff,0x34512b,2));

const sun = new THREE.DirectionalLight(0xffffff,2.2);
sun.position.set(-25,45,20);
sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left = -55;
sun.shadow.camera.right = 55;
sun.shadow.camera.top = 55;
sun.shadow.camera.bottom = -55;
scene.add(sun);

// ---------------- MATERIALS ----------------

const materials = {
  grass: new THREE.MeshStandardMaterial({color:0x548c43}),
  darkGrass: new THREE.MeshStandardMaterial({color:0x315f35}),
  trunk: new THREE.MeshStandardMaterial({color:0x755039}),
  leaf: new THREE.MeshStandardMaterial({color:0x226a3c}),
  rock: new THREE.MeshStandardMaterial({color:0x777d78}),
  wall: new THREE.MeshStandardMaterial({color:0xb1a68b}),
  roof: new THREE.MeshStandardMaterial({color:0x52675a}),
  player: new THREE.MeshStandardMaterial({color:0x1596ff}),
  bot: new THREE.MeshStandardMaterial({color:0xffa32b}),
  skin: new THREE.MeshStandardMaterial({color:0xe5b58d})
};

// ---------------- WORLD ----------------

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(120,120),
  materials.grass
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// Decorative island border
const ocean = new THREE.Mesh(
  new THREE.CylinderGeometry(75,75,3,64),
  new THREE.MeshStandardMaterial({color:0x167eaa})
);
ocean.position.y = -2.2;
scene.add(ocean);

// Roads
const road = new THREE.Mesh(
  new THREE.PlaneGeometry(9,100),
  new THREE.MeshStandardMaterial({color:0x555c55})
);
road.rotation.x = -Math.PI/2;
road.position.y = .025;
scene.add(road);

const crossRoad = road.clone();
crossRoad.rotation.z = Math.PI/2;
scene.add(crossRoad);

// ---------------- BUILDINGS ----------------

function building(x,z,w,d) {
  const group = new THREE.Group();

  const body = new THREE.Mesh(
    new THREE.BoxGeometry(w,5,d),
    materials.wall
  );
  body.position.y = 2.5;
  body.castShadow = true;
  body.receiveShadow = true;
  group.add(body);

  const roof = new THREE.Mesh(
    new THREE.BoxGeometry(w+.5,.6,d+.5),
    materials.roof
  );
  roof.position.y = 5.3;
  roof.castShadow = true;
  group.add(roof);

  const door = new THREE.Mesh(
    new THREE.BoxGeometry(1.2,2.2,.15),
    new THREE.MeshStandardMaterial({color:0x49301d})
  );
  door.position.set(0,1.1,d/2+.08);
  group.add(door);

  group.position.set(x,0,z);
  scene.add(group);
}

building(-14,-13,9,8);
building(16,-15,11,8);
building(-17,17,8,10);
building(18,18,10,8);

// ---------------- TREES ----------------

function tree(x,z) {
  const group = new THREE.Group();

  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(.3,.5,3,7),
    materials.trunk
  );
  trunk.position.y = 1.5;
  trunk.castShadow = true;
  group.add(trunk);

  const leaves = new THREE.Mesh(
    new THREE.ConeGeometry(2.2,5,8),
    materials.leaf
  );
  leaves.position.y = 5;
  leaves.castShadow = true;
  group.add(leaves);

  group.position.set(x,0,z);
  scene.add(group);
}

for(let i=0;i<65;i++){
  const a = Math.random()*Math.PI*2;
  const r = 13+Math.random()*37;
  const x = Math.cos(a)*r;
  const z = Math.sin(a)*r;

  if(Math.abs(x)<23 && Math.abs(z)<23) continue;
  tree(x,z);
}

// Rocks
for(let i=0;i<30;i++){
  const rock = new THREE.Mesh(
    new THREE.DodecahedronGeometry(.5+Math.random(),1),
    materials.rock
  );
  rock.position.set(
    (Math.random()-.5)*85,
    .5,
    (Math.random()-.5)*85
  );
  rock.castShadow = true;
  scene.add(rock);
}

// ---------------- CHARACTER ----------------

function createCharacter(material) {
  const group = new THREE.Group();

  const body = new THREE.Mesh(
    new THREE.CapsuleGeometry(.48,.9,4,8),
    material
  );
  body.position.y = 1.15;
  body.castShadow = true;
  group.add(body);

  const head = new THREE.Mesh(
    new THREE.SphereGeometry(.32,16,12),
    materials.skin
  );
  head.position.y = 2.05;
  head.castShadow = true;
  group.add(head);

  const backpack = new THREE.Mesh(
    new THREE.BoxGeometry(.65,.75,.3),
    new THREE.MeshStandardMaterial({color:0x283e35})
  );
  backpack.position.set(0,1.25,-.43);
  group.add(backpack);

  const leftLeg = new THREE.Mesh(
    new THREE.BoxGeometry(.23,.65,.25),
    materials.trunk
  );
  leftLeg.position.set(-.2,.35,0);
  group.add(leftLeg);

  const rightLeg = leftLeg.clone();
  rightLeg.position.x = .2;
  group.add(rightLeg);

  group.userData.leftLeg = leftLeg;
  group.userData.rightLeg = rightLeg;

  return group;
}

// ---------------- PLAYER ----------------

const player = createCharacter(materials.player);
player.position.set(0,0,0);
scene.add(player);

const bots = [];

for(let i=0;i<5;i++){
  const bot = createCharacter(materials.bot);
  const angle = i*Math.PI*2/5;

  bot.position.set(
    Math.sin(angle)*20,
    0,
    Math.cos(angle)*20
  );

  bot.userData.tagCount = 0;
  bot.userData.cooldown = 0;
  bot.userData.phase = Math.random()*6;
  scene.add(bot);
  bots.push(bot);
}

// ---------------- CAMERA ----------------

let cameraAngle = 0;
let cameraHeight = 5;
let cameraDistance = 8;

function updateCamera(){
  const x = player.position.x -
    Math.sin(cameraAngle)*cameraDistance;
  const z = player.position.z -
    Math.cos(cameraAngle)*cameraDistance;

  camera.position.set(
    x,
    player.position.y+cameraHeight,
    z
  );

  camera.lookAt(
    player.position.x,
    player.position.y+1.3,
    player.position.z
  );
}

// ---------------- MOBILE CONTROLS ----------------

let joyX=0, joyY=0, joyActive=false;

const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");

function moveStick(e){
  const rect = joystick.getBoundingClientRect();
  let x=e.clientX-rect.left-joystick.clientWidth/2;
  let y=e.clientY-rect.top-joystick.clientHeight/2;

  const limit=joystick.clientWidth*.30;
  const distance=Math.hypot(x,y);

  if(distance>limit){
    x=x/distance*limit;
    y=y/distance*limit;
  }

  joyX=x/limit;
  joyY=y/limit;
  stick.style.transform=`translate(${x}px,${y}px)`;
}

joystick.addEventListener("pointerdown",e=>{
  joyActive=true;
  joystick.setPointerCapture(e.pointerId);
  moveStick(e);
});

joystick.addEventListener("pointermove",e=>{
  if(joyActive) moveStick(e);
});

function resetJoystick(){
  joyActive=false;
  joyX=0;
  joyY=0;
  stick.style.transform="translate(0,0)";
}

joystick.addEventListener("pointerup",resetJoystick);
joystick.addEventListener("pointercancel",resetJoystick);

// Camera touch controls
let looking=false;
let lastX=0;

renderer.domElement.addEventListener("pointerdown",e=>{
  looking=true;
  lastX=e.clientX;
});

renderer.domElement.addEventListener("pointermove",e=>{
  if(!looking) return;

  const dx=e.clientX-lastX;
  cameraAngle-=dx*.007;
  lastX=e.clientX;
});

renderer.domElement.addEventListener("pointerup",()=>{
  looking=false;
});

renderer.domElement.addEventListener("pointercancel",()=>{
  looking=false;
});

// ---------------- KEYBOARD ----------------

const keys={};

window.addEventListener("keydown",e=>{
  keys[e.key.toLowerCase()]=true;
});

window.addEventListener("keyup",e=>{
  keys[e.key.toLowerCase()]=false;
});

// ---------------- JUMP & SPRINT ----------------

let velocityY=0;
let onGround=true;
let sprinting=false;

document.getElementById("jump").addEventListener("pointerdown",e=>{
  e.preventDefault();
  if(onGround && running){
    velocityY=8;
    onGround=false;
  }
});

const sprintButton=document.getElementById("sprint");

sprintButton.addEventListener("pointerdown",e=>{
  e.preventDefault();
  sprinting=true;
});

["pointerup","pointercancel","pointerleave"].forEach(event=>{
  sprintButton.addEventListener(event,()=>{
    sprinting=false;
  });
});

// ---------------- ENERGY PULSE ----------------

let pulseCooldown=false;
let eliminated=0;

const pulseButton=document.getElementById("pulse");

pulseButton.addEventListener("pointerdown",e=>{
  e.preventDefault();

  if(pulseCooldown || !running) return;

  pulseCooldown=true;

  const pulse=new THREE.Mesh(
    new THREE.SphereGeometry(1,24,24),
    new THREE.MeshBasicMaterial({
      color:0x51ffff,
      transparent:true,
      opacity:.5,
      wireframe:true
    })
  );

  pulse.position.copy(player.position);
  pulse.position.y=1.2;
  scene.add(pulse);

  let scale=1;

  function expand(){
    scale+=.2;
    pulse.scale.setScalar(scale);
    pulse.material.opacity=Math.max(0,.5-scale*.04);

    if(scale<5){
      requestAnimationFrame(expand);
    }else{
      scene.remove(pulse);
      pulse.geometry.dispose();
      pulse.material.dispose();
    }
  }
  expand();

  bots.forEach(bot=>{
    if(!bot.visible) return;

    if(player.position.distanceTo(bot.position)<7){
      bot.userData.tagCount++;

      if(bot.userData.tagCount>=3){
        bot.visible=false;
        eliminated++;
        updatePlayerCount();
      }
    }
  });

  setTimeout(()=>pulseCooldown=false,1100);
});

// ---------------- SAFE ZONE ----------------

let zoneRadius=44;
let zoneClock=0;
let zoneMesh=new THREE.Mesh(
  new THREE.RingGeometry(43.7,44,100),
  new THREE.MeshBasicMaterial({
    color:0x50ffff,
    side:THREE.DoubleSide,
    transparent:true,
    opacity:.75
  })
);

zoneMesh.rotation.x=-Math.PI/2;
zoneMesh.position.y=.1;
scene.add(zoneMesh);

// ---------------- GAME STATE ----------------

let running=false;
let gameOver=false;
let health=100;
let gameTime=0;

const overlay=document.getElementById("overlay");
const hud=document.getElementById("hud");
const message=document.getElementById("message");

function updatePlayerCount(){
  document.getElementById("players").textContent=
    bots.filter(bot=>bot.visible).length+1;
}

function updateHealth(){
  document.getElementById("healthFill").style.width=
    health+"%";

  document.getElementById("healthText").textContent=
    health+" / 100";
}

function finishGame(win){
  running=false;
  gameOver=true;
  overlay.style.display="flex";

  document.querySelector("#menu h1").textContent=
    win?"VICTORY!":"GAME OVER";

  document.querySelector("#menu h2").textContent=
    win?"ARENA CHAMPION":"TRY AGAIN";

  document.querySelector("#menu p").textContent=
    win?"Congratulations! You are the last survivor."
    :"Your adventure has ended. Try again!";

  document.getElementById("start").textContent="PLAY AGAIN";
  document.getElementById("settings").style.display="none";
}

function startGame(){
  health=100;
  eliminated=0;
  zoneRadius=44;
  zoneClock=0;
  gameTime=0;
  velocityY=0;
  onGround=true;
  gameOver=false;
  running=true;
  cameraAngle=0;
  player.position.set(0,0,0);

  bots.forEach((bot,i)=>{
    const angle=i*Math.PI*2/5;
    bot.position.set(
      Math.sin(angle)*20,
      0,
      Math.cos(angle)*20
    );
    bot.userData.tagCount=0;
    bot.userData.cooldown=0;
    bot.visible=true;
  });

  zoneMesh.scale.setScalar(1);
  updatePlayerCount();
  updateHealth();

  overlay.style.display="none";
  hud.classList.remove("hidden");
  message.textContent="GOOD LUCK, SURVIVOR!";

  setTimeout(()=>{
    if(running) message.textContent="";
  },2200);
}

document.getElementById("start").addEventListener("click",startGame);

document.getElementById("settingBtn").addEventListener("click",()=>{
  const settings=document.getElementById("settings");
  settings.style.display=
    settings.style.display==="block"?"none":"block";
});

document.getElementById("shadows").addEventListener("change",e=>{
  renderer.shadowMap.enabled=e.target.checked;
  sun.castShadow=e.target.checked;
});

document.getElementById("sound").addEventListener("change",e=>{
  // Sound effects can be connected in a future update.
});

// ---------------- MINIMAP ----------------

const mapCanvas=document.getElementById("miniMap");
const mapCtx=mapCanvas.getContext("2d");

function drawMap(){
  const w=200;
  mapCtx.clearRect(0,0,w,w);

  mapCtx.fillStyle="#254d35";
  mapCtx.fillRect(0,0,w,w);

  mapCtx.strokeStyle="#777";
  mapCtx.lineWidth=15;
  mapCtx.beginPath();
  mapCtx.moveTo(100,0);
  mapCtx.lineTo(100,200);
  mapCtx.moveTo(0,100);
  mapCtx.lineTo(200,100);
  mapCtx.stroke();

  mapCtx.strokeStyle="#63ffb0";
  mapCtx.lineWidth=2;
  mapCtx.beginPath();
  mapCtx.arc(100,100,zoneRadius/60*100,0,Math.PI*2);
  mapCtx.stroke();

  function dot(x,z,color,size){
    const px=100+x/60*100;
    const py=100+z/60*100;
    mapCtx.fillStyle=color;
    mapCtx.beginPath();
    mapCtx.arc(px,py,size,0,Math.PI*2);
    mapCtx.fill();
  }

  bots.forEach(bot=>{
    if(bot.visible) dot(bot.position.x,bot.position.z,"#ffad48",4);
  });

  dot(player.position.x,player.position.z,"#42eaff",5);
}

// ---------------- MAIN LOOP ----------------

let lastTime=0;

function animate(time){
  requestAnimationFrame(animate);

  const dt=Math.min((time-lastTime)/1000,.04);
  lastTime=time;

  if(running){

    gameTime+=dt;

    // Movement direction
    let x=joyX;
    let y=joyY;

    if(keys["w"]||keys["arrowup"]) y-=1;
    if(keys["s"]||keys["arrowdown"]) y+=1;
    if(keys["a"]||keys["arrowleft"]) x-=1;
    if(keys["d"]||keys["arrowright"]) x+=1;

    const forward=new THREE.Vector3(
      -Math.sin(cameraAngle),0,-Math.cos(cameraAngle)
    );

    const right=new THREE.Vector3(
      Math.cos(cameraAngle),0,-Math.sin(cameraAngle)
    );

    const direction=new THREE.Vector3()
      .addScaledVector(forward,-y)
      .addScaledVector(right,x);

    if(direction.lengthSq()>1) direction.normalize();

    const moving=direction.lengthSq()>.01;
    const speed=(sprinting||keys["shift"])?10:6;

    if(moving){
      player.position.addScaledVector(direction,speed*dt);
      player.rotation.y=Math.atan2(direction.x,direction.z);

      const swing=Math.sin(gameTime*12)*.5;
      player.userData.leftLeg.rotation.x=swing;
      player.userData.rightLeg.rotation.x=-swing;
    }else{
      player.userData.leftLeg.rotation.x=0;
      player.userData.rightLeg.rotation.x=0;
    }

    // Vertical movement
    velocityY-=19*dt;
    player.position.y+=velocityY*dt;

    if(player.position.y<=0){
      player.position.y=0;
      velocityY=0;
      onGround=true;
    }

    // Arena boundary
    player.position.x=THREE.MathUtils.clamp(
      player.position.x,-48,48
    );
    player.position.z=THREE.MathUtils.clamp(
      player.position.z,-48,48
    );

    // AI opponents
    bots.forEach(bot=>{
      if(!bot.visible) return;

      const dx=player.position.x-bot.position.x;
      const dz=player.position.z-bot.position.z;
      const distance=Math.hypot(dx,dz);

      const angle=Math.atan2(dx,dz);

      if(distance>3.5){
        bot.position.x+=Math.sin(angle)*1.7*dt;
        bot.position.z+=Math.cos(angle)*1.7*dt;
      }

      bot.rotation.y=angle;

      // Simple non-graphic tagging challenge
      bot.userData.cooldown-=dt;

      if(distance<2.4 && bot.userData.cooldown<=0){
        health=Math.max(0,health-5);
        bot.userData.cooldown=2;
        updateHealth();
      }
    });

    // Safe zone shrinking
    zoneClock+=dt;

    if(zoneClock>=3){
      zoneClock=0;

      if(zoneRadius>12){
        zoneRadius=Math.max(12,zoneRadius-.18);
        zoneMesh.scale.setScalar(zoneRadius/44);
      }
    }

    const playerDistance=Math.hypot(
      player.position.x,player.position.z
    );

    if(playerDistance>zoneRadius){
      health=Math.max(0,health-5*dt);
      updateHealth();
    }

    document.getElementById("zoneText").textContent=
      Math.round(zoneRadius)+" m";

    document.getElementById("timer").textContent=
      "TIME "+Math.floor(gameTime)+"s";

    if(health<=0){
      finishGame(false);
    }

    if(bots.every(bot=>!bot.visible)){
      finishGame(true);
    }

    drawMap();
  }

  updateCamera();
  renderer.render(scene,camera);
}

updateCamera();
requestAnimationFrame(animate);

// ---------------- RESIZE ----------------

window.addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
});
</script>
